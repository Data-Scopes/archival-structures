[project]
name = "archival-structures"
version = "0.1.0"
description = "A Python package for analysing and restructuring the output of Automatic Text Recognition (ATR) pipelines."
authors = [
    {name = "Marijn Koolen",email = "marijn.koolen@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["archives", "pagexml", "atr", "ocr", "digital-humanities", "document-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pagexml-tools (>=0.8.0, <1.0.0)",
    "numpy>=2.3.5,<3.0.0",
    "lxml (>=5.3.0,<7.0.0)",
    "fuzzy-search (>=2.5.0,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "orjson>=3.11.7",
    "scikit-image>=0.26.0",
    "opencv-python>=4.13.0.92",
    "torch>=2.12.0",
    "transformers>=5.11.0",
    "hdbscan>=0.8.44",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
    "ipywidgets>=8.1.0",
    "ipycanvas>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/Data-Scopes/archival-structures"
Repository = "https://github.com/Data-Scopes/archival-structures"
Issues = "https://github.com/Data-Scopes/archival-structures/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.1.0,<9.0.0"
furo = ">=2024.8.6"
myst-parser = ">=4.0.0,<5.0.0"
nbsphinx = ">=0.9.5,<1.0.0"
