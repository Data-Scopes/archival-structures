version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc
  jobs:
    post_create_environment:
      - pip install poetry
    post_install:
      - poetry config virtualenvs.create false
      - poetry install --with docs --no-interaction

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - htmlzip
